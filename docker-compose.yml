services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - crust_mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      MONGODB_URI: mongodb://mongo:27017/crust_corner
      JWT_SECRET: change-me-in-production
      CLIENT_ORIGIN: http://localhost:8787
      SOLANA_RPC: https://api.devnet.solana.com
      NFT_NETWORK: devnet
    depends_on:
      - mongo

volumes:
  crust_mongo_data:
